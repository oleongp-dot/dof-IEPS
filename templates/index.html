<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOF Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        body {
            background-color: #0D1117;
            color: #E6EDF3;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .card {
            background-color: #161B22;
            border: 1px solid #30363D;
            border-radius: 6px;
        }

        .badge-sube {
            color: #58A6FF;
        }

        .badge-baja {
            color: #FF7B72;
        }

        .badge-neutral {
            color: #8B949E;
        }
    </style>
</head>

<body class="p-4 md:p-8">

    <div id="area-reporte" class="max-w-6xl mx-auto p-4 bg-[#0D1117] rounded-xl">

        <header
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-[#30363D] pb-4 mb-6 gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">📊</span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-[#F0F6FC]">DOF Monitor</h1>
                    <p class="text-[10px] text-[#8B949E] uppercase tracking-widest" id="fecha-consulta">Sincronizando...
                    </p>
                </div>
            </div>
            <div class="flex gap-2" id="controles-principales">
                <button id="btn-screenshot" onclick="descargarReporteCanvasNativo()"
                    class="bg-[#21262D] hover:bg-[#30363D] text-[#C9D1D9] border border-[#30363D] font-medium text-xs px-3 py-2 rounded transition flex items-center gap-2 cursor-pointer">
                    📸 Reporte (PNG)
                </button>
                <button id="btn-actualizar" onclick="consultarAPI(true)"
                    class="bg-[#238636] hover:bg-[#2EA043] text-white font-medium text-xs px-3 py-2 rounded transition cursor-pointer">
                    Actualizar
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <!-- TARJETA TIPO DE CAMBIO -->
            <div class="card p-4 flex flex-col justify-between min-h-[135px]">
                <div>
                    <p class="text-[10px] font-semibold text-[#8B949E] uppercase tracking-wider">💱 Tipo de Cambio</p>
                    <h2 class="text-2xl font-bold mt-2 text-[#F0F6FC]" id="val-tc">--</h2>
                </div>
                <p class="text-xs font-mono mt-2" id="var-tc">--</p>
            </div>

            <!-- TARJETA REGULAR -->
            <div class="card p-4 flex flex-col justify-between min-h-[135px]">
                <div>
                    <div class="flex justify-between items-start">
                        <p class="text-[10px] font-semibold text-[#8B949E] uppercase tracking-wider">🛢️ Regular (&lt;91
                            OCT)</p>
                        <span id="badge-adic-regular"
                            class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-[#238636]/20 text-[#3FB950] border border-[#238636]/40 hidden">
                            Est. Adic: $0.0000
                        </span>
                    </div>
                    <p class="text-[9px] text-[#8B949E] font-medium mt-0.5" id="vigencia-regular">--</p>
                    <div class="flex items-baseline gap-2 mt-1">
                        <h2 class="text-2xl font-bold text-[#F0F6FC]" id="val-regular">--</h2>
                        <span class="text-[10px] font-semibold text-[#8B949E]" id="cpg-regular"></span>
                    </div>
                </div>
                <p class="text-xs font-mono mt-2" id="var-regular">--</p>
            </div>

            <!-- TARJETA PREMIUM -->
            <div class="card p-4 flex flex-col justify-between min-h-[135px]">
                <div>
                    <div class="flex justify-between items-start">
                        <p class="text-[10px] font-semibold text-[#8B949E] uppercase tracking-wider">🛢️ Premium</p>
                        <span id="badge-adic-premium"
                            class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-[#238636]/20 text-[#3FB950] border border-[#238636]/40 hidden">
                            Est. Adic: $0.0000
                        </span>
                    </div>
                    <p class="text-[9px] text-[#8B949E] font-medium mt-0.5" id="vigencia-premium">--</p>
                    <div class="flex items-baseline gap-2 mt-1">
                        <h2 class="text-2xl font-bold text-[#F0F6FC]" id="val-premium">--</h2>
                        <span class="text-[10px] font-semibold text-[#8B949E]" id="cpg-premium"></span>
                    </div>
                </div>
                <p class="text-xs font-mono mt-2" id="var-premium">--</p>
            </div>

            <!-- TARJETA DIÉSEL -->
            <div class="card p-4 flex flex-col justify-between min-h-[135px]">
                <div>
                    <div class="flex justify-between items-start">
                        <p class="text-[10px] font-semibold text-[#8B949E] uppercase tracking-wider">🛢️ Diésel</p>
                        <span id="badge-adic-diesel"
                            class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-[#238636]/20 text-[#3FB950] border border-[#238636]/40 hidden">
                            Est. Adic: $0.0000
                        </span>
                    </div>
                    <p class="text-[9px] text-[#8B949E] font-medium mt-0.5" id="vigencia-diesel">--</p>
                    <div class="flex items-baseline gap-2 mt-1">
                        <h2 class="text-2xl font-bold text-[#F0F6FC]" id="val-diesel">--</h2>
                        <span class="text-[10px] font-semibold text-[#8B949E]" id="cpg-diesel"></span>
                    </div>
                </div>
                <p class="text-xs font-mono mt-2" id="var-diesel">--</p>
            </div>
        </div>

        <div class="flex justify-end gap-2 mb-4 border-b border-[#30363D] pb-3" id="controles-csv">
            <span class="text-[10px] text-[#8B949E] self-center mr-2 font-bold uppercase">Descargar Datos Crudos:</span>
            <button onclick="descargarCSV('tc')"
                class="text-[#8B949E] hover:text-[#E6EDF3] text-[10px] border border-[#30363D] px-2 py-1 rounded transition flex items-center gap-1 cursor-pointer">
                📥 TC (.csv)
            </button>
            <button onclick="descargarCSV('ieps')"
                class="text-[#8B949E] hover:text-[#E6EDF3] text-[10px] border border-[#30363D] px-2 py-1 rounded transition flex items-center gap-1 cursor-pointer">
                📥 IEPS (.csv)
            </button>
        </div>

        <main id="bloque-grafica" class="card p-4 min-h-[400px] flex flex-col justify-center relative">
            <div id="loading-overlay"
                class="absolute inset-0 bg-[#0D1117]/80 flex flex-col items-center justify-center gap-3 z-10 rounded">
                <div class="animate-spin rounded-full h-8 w-8 border-4 border-[#30363D] border-t-[#58A6FF]"></div>
                <p class="text-xs text-[#8B949E]">Consultando Diario Oficial...</p>
            </div>
            <div id="contenedor-grafica" class="w-full"></div>
        </main>
    </div>

    <script>
        let cacheLocalRaw = null;

        function mapearEstiloVariacion(elementoId, variacion) {
            const el = document.getElementById(elementoId);
            if (!variacion) {
                el.className = "text-xs font-mono mt-2 badge-neutral";
                el.innerText = "--";
                return;
            }
            el.innerText = variacion.texto;
            if (variacion.tipo === "sube") {
                el.className = "text-xs font-mono mt-2 badge-sube";
            } else if (variacion.tipo === "baja") {
                el.className = "text-xs font-mono mt-2 badge-baja";
            } else {
                el.className = "text-xs font-mono mt-2 badge-neutral";
            }
        }

        function calcularEInyectarCPG(elementoId, valorMxnLitro, tipoCambio) {
            if (valorMxnLitro && tipoCambio && tipoCambio > 0) {
                const cpg = (valorMxnLitro / tipoCambio) * 3.78541 * 100;
                document.getElementById(elementoId).innerText = `/ ${cpg.toFixed(1)} cpg`;
            }
        }

        function calcularVariacionCPG(elementoId, variacionObjeto, tipoCambio) {
            const el = document.getElementById(elementoId);
            if (!variacionObjeto || !variacionObjeto.texto || !tipoCambio || tipoCambio <= 0) return;
            if (variacionObjeto.tipo === "neutral") return;

            const coincidencia = variacionObjeto.texto.match(/[0-9.]+/);
            if (coincidencia) {
                const valorMxn = parseFloat(coincidencia[0]);
                const cpgVar = (valorMxn / tipoCambio) * 3.78541 * 100;
                const signo = variacionObjeto.tipo === "sube" ? "+" : "-";
                el.innerText = `${variacionObjeto.texto} (${signo}${cpgVar.toFixed(1)} cpg)`;
            }
        }

        async function consultarAPI(forzar = false) {
            const overlay = document.getElementById('loading-overlay');
            const btnAct = document.getElementById('btn-actualizar');

            overlay.classList.remove('hidden');
            btnAct.disabled = true;

            try {
                const url = forzar ? '/api/consultar?force=true' : '/api/consultar';
                const res = await fetch(url);
                const data = await res.json();
                cacheLocalRaw = data;

                document.getElementById('fecha-consulta').innerText =
                    `Sincronización: ${data.fecha_consulta} ${data.desde_cache ? '(Caché)' : '(Vivo)'}`;

                let tcActual = 0;
                if (data.tipo_cambio) {
                    tcActual = data.tipo_cambio.valor;
                    document.getElementById('val-tc').innerText = `$${tcActual.toFixed(4)}`;
                    mapearEstiloVariacion('var-tc', data.tipo_cambio.variacion);
                }

                if (data.ieps) {
                    const textoVigencia = data.ieps.vigencia ? data.ieps.vigencia : "Vigencia no disponible";
                    const fuels = ['regular', 'premium', 'diesel'];

                    fuels.forEach(f => {
                        if (document.getElementById(`vigencia-${f}`)) {
                            document.getElementById(`vigencia-${f}`).innerText = textoVigencia;
                        }

                        if (data.ieps[f]) {
                            document.getElementById(`val-${f}`).innerText = `$${data.ieps[f].valor.toFixed(4)}`;

                            const badge = document.getElementById(`badge-adic-${f}`);
                            if (badge) {
                                const valAdic = data.ieps[f].adicional || 0.0;
                                badge.innerText = `Est. Adic: $${valAdic.toFixed(4)}`;
                                badge.classList.remove('hidden');
                            }

                            mapearEstiloVariacion(`var-${f}`, data.ieps[f].variacion);
                            calcularEInyectarCPG(`cpg-${f}`, data.ieps[f].valor, tcActual);
                            calcularVariacionCPG(`var-${f}`, data.ieps[f].variacion, tcActual);
                        }
                    });
                }

                if (data.grafica) {
                    const parsed = JSON.parse(data.grafica);
                    const config = { responsive: true, displayModeBar: true, displaylogo: false };
                    Plotly.newPlot('contenedor-grafica', parsed.data, parsed.layout, config);
                }
            } catch (e) {
                console.error(e);
            } finally {
                overlay.classList.add('hidden');
                btnAct.disabled = false;
            }
        }

        function descargarReporteCanvasNativo() {
            const nodoGrafica = document.getElementById('contenedor-grafica');
            const btnScr = document.getElementById('btn-screenshot');

            if (!nodoGrafica || !nodoGrafica.data) {
                alert("La gráfica aún no está lista.");
                return;
            }

            btnScr.innerText = "📸 Generando...";
            btnScr.disabled = true;

            Plotly.toImage(nodoGrafica, { format: 'png', width: 1100, height: 600, scale: 2 })
                .then(graficaUrl => {
                    const imgGrafica = new Image();
                    imgGrafica.crossOrigin = "anonymous";
                    imgGrafica.onload = function () {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        canvas.width = 2400;
                        canvas.height = 1800;

                        // Fondo general
                        ctx.fillStyle = "#0D1117";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // Encabezado
                        ctx.fillStyle = "#F0F6FC";
                        ctx.font = "bold 48px sans-serif";
                        ctx.fillText("📊 DOF Monitor", 80, 100);

                        ctx.fillStyle = "#8B949E";
                        ctx.font = "24px sans-serif";
                        const fechaTexto = document.getElementById('fecha-consulta').innerText;
                        ctx.fillText(fechaTexto.toUpperCase(), 80, 145);

                        ctx.strokeStyle = "#30363D";
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(80, 185);
                        ctx.lineTo(2320, 185);
                        ctx.stroke();

                        // Tarjetas de Métricas
                        const tarjetas = [
                            { titulo: "💱 TIPO DE CAMBIO", val: document.getElementById('val-tc').innerText, var: document.getElementById('var-tc').innerText },
                            { titulo: "🛢️ REGULAR (<91 OCT)", val: document.getElementById('val-regular').innerText, var: document.getElementById('var-regular').innerText, sub: document.getElementById('vigencia-regular').innerText, adic: document.getElementById('badge-adic-regular').innerText },
                            { titulo: "🛢️ PREMIUM", val: document.getElementById('val-premium').innerText, var: document.getElementById('var-premium').innerText, sub: document.getElementById('vigencia-premium').innerText, adic: document.getElementById('badge-adic-premium').innerText },
                            { titulo: "🛢️ DIÉSEL", val: document.getElementById('val-diesel').innerText, var: document.getElementById('var-diesel').innerText, sub: document.getElementById('vigencia-diesel').innerText, adic: document.getElementById('badge-adic-diesel').innerText }
                        ];

                        let cardWidth = 525;
                        let cardHeight = 240;
                        let startX = 80;
                        let startY = 230;
                        let gap = 40;

                        tarjetas.forEach((t, index) => {
                            let cx = startX + (index * (cardWidth + gap));
                            let cy = startY;

                            ctx.fillStyle = "#161B22";
                            ctx.fillRect(cx, cy, cardWidth, cardHeight);
                            ctx.strokeStyle = "#30363D";
                            ctx.lineWidth = 3;
                            ctx.strokeRect(cx, cy, cardWidth, cardHeight);

                            ctx.fillStyle = "#8B949E";
                            ctx.font = "bold 20px sans-serif";
                            ctx.fillText(t.titulo, cx + 35, cy + 50);

                            if (t.sub) {
                                ctx.fillStyle = "#8B949E";
                                ctx.font = "18px sans-serif";
                                ctx.fillText(t.sub, cx + 35, cy + 80);
                            }

                            // Dibujar la etiqueta de Estímulo Adicional si existe en la tarjeta
                            if (t.adic) {
                                let badgeX = cx + cardWidth - 230;
                                let badgeY = cy + 32;
                                ctx.fillStyle = "rgba(35, 134, 54, 0.2)";
                                ctx.fillRect(badgeX, badgeY, 195, 36);
                                ctx.strokeStyle = "rgba(35, 134, 54, 0.4)";
                                ctx.lineWidth = 2;
                                ctx.strokeRect(badgeX, badgeY, 195, 36);

                                ctx.fillStyle = "#3FB950";
                                ctx.font = "bold 16px monospace";
                                ctx.fillText(t.adic, badgeX + 12, badgeY + 24);
                            }

                            ctx.fillStyle = "#F0F6FC";
                            ctx.font = "bold 52px sans-serif";
                            ctx.fillText(t.val, cx + 35, cy + (t.sub ? 145 : 120));

                            ctx.fillStyle = t.var.includes("+") ? "#58A6FF" : (t.var.includes("-") ? "#FF7B72" : "#8B949E");
                            ctx.font = "bold 22px monospace";
                            ctx.fillText(t.var, cx + 35, cy + cardHeight - 35);
                        });

                        let graficaY = startY + cardHeight + 50;

                        ctx.fillStyle = "#161B22";
                        ctx.fillRect(80, graficaY, 2240, 1150);
                        ctx.strokeStyle = "#30363D";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(80, graficaY, 2240, 1150);

                        ctx.drawImage(imgGrafica, 120, graficaY + 40, 2160, 1070);

                        const link = document.createElement('a');
                        link.download = `Reporte_DOF_${new Date().toISOString().slice(0, 10)}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();

                        btnScr.innerText = "📸 Reporte (PNG)";
                        btnScr.disabled = false;
                    };
                    imgGrafica.src = graficaUrl;
                })
                .catch(err => {
                    console.error("Error al exportar gráfica:", err);
                    btnScr.innerText = "📸 Reporte (PNG)";
                    btnScr.disabled = false;
                });
        }

        function descargarCSV(tipo) {
            if (!cacheLocalRaw || !cacheLocalRaw.historico_raw) return alert("Cargando datos...");
            const raw = cacheLocalRaw.historico_raw;
            let csv = "\ufeff";
            let filename = "";

            if (tipo === 'tc') {
                csv += "Fecha,Tipo de Cambio USD/MXN\n";
                filename = "dof_tc_historico.csv";
                raw.fechas_tc.forEach((f, i) => csv += `${f},${raw.valores_tc[i]}\n`);
            } else {
                csv += "Fecha Publicacion,Vigencia,Regular,Est_Adic_Regular,Premium,Est_Adic_Premium,Diesel,Est_Adic_Diesel\n";
                filename = "dof_ieps_historico.csv";
                raw.fechas_ieps.forEach((f, i) => {
                    const vigenciaText = raw.vigencias_ieps && raw.vigencias_ieps[i] ? raw.vigencias_ieps[i] : "No disponible";
                    const adicReg = raw.vals_adic_regular && raw.vals_adic_regular[i] !== undefined ? raw.vals_adic_regular[i] : 0.0;
                    const adicPrem = raw.vals_adic_premium && raw.vals_adic_premium[i] !== undefined ? raw.vals_adic_premium[i] : 0.0;
                    const adicDiesel = raw.vals_adic_diesel && raw.vals_adic_diesel[i] !== undefined ? raw.vals_adic_diesel[i] : 0.0;

                    csv += `${f},"${vigenciaText}",${raw.vals_regular[i]},${adicReg},${raw.vals_premium[i]},${adicPrem},${raw.vals_diesel[i]},${adicDiesel}\n`;
                });
            }

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        window.onload = () => consultarAPI(false);
    </script>
</body>

</html>
